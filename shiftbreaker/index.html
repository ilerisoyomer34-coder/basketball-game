<title>SHIFTBREAKER</title>
<meta name="description" content="Açık dünya araba oyunu: gerçek manuel vites, debriyaj, stop etme ve 6→1 motor patlaması.">
<meta name="theme-color" content="#111317">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  /* Layout: full-bleed 3D canvas; HUD clusters pinned to the screen corners; menus float as dark panels. */
  :root {
    --bg: #111317;
    --panel: rgba(17, 19, 23, 0.93);
    --panel2: rgba(30, 33, 39, 0.9);
    --ink: #f2efe8;
    --ink2: rgba(242, 239, 232, 0.64);
    --line: rgba(242, 239, 232, 0.14);
    --red: #e5482d;
    --amber: #f2a93b;
    --blue: #5ce1ff;
    --good: #3fd47a;
    --warn: #f2b13b;
    --bad: #e5482d;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --mono: "Chakra Petch", "Consolas", "Menlo", monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body[data-cb="deuter"], body[data-cb="prot"] { --good: #3b8cff; --bad: #ff8c1a; --red: #ff8c1a; }
  body[data-cb="trit"] { --good: #2bd3c4; --bad: #e83e5c; --red: #e83e5c; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  button { font: inherit; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
  kbd { font-family: var(--mono); font-size: 0.85em; background: rgba(255,255,255,0.1); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

  /* ---------- loading ---------- */
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 50; }
  #loading .ld { text-align: center; display: grid; gap: 10px; }
  #loading h1 { font-size: clamp(42px, 9vw, 92px); letter-spacing: 0.04em; margin: 0; font-weight: 800; line-height: 0.9; }
  #loading h1 span { color: var(--red); }
  #loading .bar { width: min(320px, 70vw); height: 3px; background: var(--line); margin: 0 auto; overflow: hidden; }
  #loading .bar i { display: block; height: 100%; width: 40%; background: var(--red); animation: ld 1.1s ease-in-out infinite; }
  @keyframes ld { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  #loadmsg { color: var(--ink2); font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-family: var(--display); }
  #hud.hidden { display: none; }
  .hud-br { position: absolute; right: max(14px, env(safe-area-inset-right, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: auto auto; grid-template-areas: "side tach" "lamps lamps"; gap: 8px 10px; align-items: end; }
  .hud-side { grid-area: side; display: grid; gap: 8px; justify-items: end; }
  #tachWrap { grid-area: tach; position: relative; display: grid; justify-items: center; }
  #leds { display: flex; gap: 4px; margin-bottom: 4px; }
  #leds i { width: 15px; height: 7px; border-radius: 2px; background: rgba(255,255,255,0.08); }
  #suggest { position: absolute; right: 22px; top: 92px; font-size: 20px; color: var(--amber); font-family: var(--mono); }
  .row { display: flex; gap: 8px; align-items: flex-end; }
  #pedals { width: 150px; height: 72px; padding: 3px 4px; background: rgba(12,13,17,0.7); border-radius: 6px; }
  #pedals svg { display: block; width: 100%; height: 100%; overflow: visible; }
  .hw-rim { fill: none; stroke: #2c2f36; stroke-width: 6; } .hw-rim2 { fill: none; stroke: rgba(255,255,255,0.14); stroke-width: 1; }
  .hw-spoke { fill: #40444d; } .hw-hub { fill: #1b1d22; stroke: var(--red); stroke-width: 1.5; } .hw-mark { fill: var(--amber); }
  .hl-boot { fill: #191b1f; } .hl-shaft { fill: #4c515a; } .hl-grip { fill: #22252b; stroke: #5a5f68; stroke-width: 1; } .hl-btn { fill: #b9bec4; }
  #pedals.hb-on .hl-grip { stroke: var(--amber); stroke-width: 1.6; }
  .hp-arm { fill: #3a3e46; } .hp-pl { fill: #2d3037; stroke: #50555e; stroke-width: 1; } .hp-rib { fill: #17191d; }
  .hp-gl { opacity: 0; } .hp-c { fill: var(--blue); } .hp-b { fill: var(--bad); } .hp-g { fill: var(--good); }
  .hp-bite { fill: var(--amber); }
  .hp-t { fill: var(--ink2); font: 700 8px var(--mono); text-anchor: middle; }
  .gauges { display: grid; gap: 4px; width: 150px; padding: 6px 8px; background: rgba(12,13,17,0.7); border-radius: 6px; font-size: 12px; color: var(--ink2); letter-spacing: 0.05em; text-transform: uppercase; }
  .gauge { display: grid; grid-template-columns: 34px 1fr; align-items: center; gap: 6px; }
  .gauge div { height: 5px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .gauge i { display: block; height: 100%; background: var(--ink); }
  .gauge i.low { background: var(--bad); }
  #consume { font-family: var(--mono); color: var(--ink); text-align: right; font-size: 12px; }
  .lamps { grid-area: lamps; display: flex; gap: 6px; justify-content: flex-end; }
  .lamps b { font: 700 11px/1 var(--mono); padding: 4px 5px; border-radius: 3px; color: rgba(255,255,255,0.18); background: rgba(12,13,17,0.6); letter-spacing: 0.02em; }
  .lamps b.on { color: #111; background: var(--amber); }
  .lamps b.on.r { background: var(--bad); color: #fff; }
  .lamps b.on.g { background: var(--good); }
  .lamps b.on.b { background: #4aa3ff; color: #fff; }
  .hud-bl { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: flex; gap: 10px; align-items: flex-end; }
  #mapWrap { position: relative; width: 170px; height: 170px; border-radius: 50%; box-shadow: 0 6px 24px rgba(0,0,0,0.45); }
  .topbar { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; align-items: center; font: 600 15px/1 var(--mono); background: rgba(12,13,17,0.62); padding: 7px 12px; border-radius: 6px; }
  /* police pursuit panel */
  #chase { background: rgba(12,13,17,0.8); border: 1px solid rgba(255,59,48,0.35); border-radius: 8px; padding: 8px 12px 10px; width: 290px; box-sizing: border-box; display: grid; gap: 6px; box-shadow: 0 0 0 0 rgba(255,59,48,0); }
  #chase .ch-top, #chase .ch-mid { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  #chStars { font-size: 21px; letter-spacing: 2px; color: rgba(255,255,255,0.28); }
  #chStars b { color: #ff3b30; text-shadow: 0 0 8px #ff3b30; font-weight: 400; }
  #chTime { font: 600 15px/1 var(--mono); color: var(--ink2); }
  #chState { font: 700 12px/1 var(--display); letter-spacing: 0.05em; text-transform: uppercase; color: #ffb4a8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #chBounty { font: 700 14px/1 var(--mono); color: var(--amber); white-space: nowrap; }
  .ch-bar { position: relative; height: 15px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
  .ch-bar i { position: absolute; inset: 0 auto 0 0; width: 0; transition: width 0.15s linear; }
  .ch-bar.ev i { background: linear-gradient(90deg, #1f9d55, #3fd47a); }
  .ch-bar.bu i { background: linear-gradient(90deg, #b3261e, #ff4b3a); }
  .ch-bar span { position: relative; display: block; font: 700 11px/15px var(--display); letter-spacing: 0.12em; text-transform: uppercase; padding-left: 6px; color: rgba(255,255,255,0.85); }
  #chase.busting { animation: chPulse 0.5s ease-in-out infinite alternate; }
  #chase.heli #chState { color: #fff1c8; }
  @keyframes chPulse { to { box-shadow: 0 0 22px 2px rgba(255,59,48,0.55); border-color: #ff3b30; } }
  #sirenGlow { position: absolute; inset: 0; opacity: 0; pointer-events: none; }
  #sirenGlow::before, #sirenGlow::after { content: ''; position: absolute; inset: 0; animation: siren 0.55s steps(1) infinite; }
  #sirenGlow::before { background: radial-gradient(ellipse at 0% 50%, rgba(255,30,30,0.55), transparent 45%); }
  #sirenGlow::after { background: radial-gradient(ellipse at 100% 50%, rgba(30,90,255,0.55), transparent 45%); animation-delay: 0.275s; }
  @keyframes siren { 0% { opacity: 1; } 50% { opacity: 0.15; } }
  .toast.radio { border-color: #2f7dff; color: #cfe0ff; text-transform: none; font-weight: 600; }
  /* police scenes: letterbox, subtitles, fade */
  .cine { position: fixed; inset: 0; z-index: 15; pointer-events: none; }
  .cine-bar { position: absolute; left: 0; right: 0; height: 11vh; background: #000; transition: height 0.6s ease; }
  .cine.report .cine-bar { height: 0; }
  .cine-bar.top { top: 0; } .cine-bar.bot { bottom: 0; }
  #cineSub { position: absolute; left: 50%; bottom: calc(11vh + 18px); transform: translateX(-50%); width: min(820px, 92vw); text-align: center; opacity: 0; transition: opacity 0.25s; text-shadow: 0 2px 10px #000; }
  #cineSub.show { opacity: 1; }
  #cineSub b { display: block; font: 700 14px/1.2 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: #8fb6ff; margin-bottom: 3px; }
  #cineSub span { font: 700 clamp(19px, 3vw, 30px)/1.2 var(--display); color: #fff; }
  #cineBig { position: absolute; left: 50%; top: 22%; transform: translate(-50%, -50%) scale(1.3); font: 800 clamp(30px, 7vw, 72px)/1 var(--display); letter-spacing: 0.04em; text-transform: uppercase; color: #fff; opacity: 0; text-shadow: 0 0 26px rgba(0,0,0,0.8); }
  #cineBig.show { animation: cineBig 2.2s ease-out forwards; }
  #cineBig.bad { color: #ff5b45; }
  @keyframes cineBig { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.4); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
  #cineSkip { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(11vh - 40px); pointer-events: auto; font: 700 14px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.75); background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; padding: 8px 12px; cursor: pointer; }
  #cineFade { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* arrest report */
  .bust { width: min(720px, 94vw); }
  .bust-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .bust-photo { position: relative; border-radius: 6px; overflow: hidden; background: #111; aspect-ratio: 16 / 9; border: 1px solid var(--line); }
  .bust-photo img { width: 100%; height: 100%; object-fit: cover; display: block; filter: contrast(1.05) saturate(0.85); }
  .bust-mugs { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; height: 100%; }
  .bust-photo:has(.bust-mugs) { aspect-ratio: 8 / 5; }
  .bust-photo .stamp { position: absolute; right: 8px; bottom: 10px; transform: rotate(-9deg); border: 3px solid #e5372a; color: #e5372a; font: 800 22px/1 var(--display); letter-spacing: 0.1em; padding: 4px 10px; border-radius: 4px; background: rgba(0,0,0,0.25); }
  .bust-photo .cap { position: absolute; left: 8px; top: 8px; font: 600 12px/1 var(--mono); color: #fff; background: rgba(0,0,0,0.55); padding: 4px 6px; border-radius: 3px; }
  .bust-rows { display: grid; gap: 7px; }
  .bust-rows div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 6px; font-size: 16px; }
  .bust-rows div b { font-family: var(--mono); font-weight: 600; }
  .bust-rows .tot { border-bottom: 0; font-size: 18px; color: #ff8f80; }
  .bust-rows div b { white-space: nowrap; }
  @media (max-width: 640px) { .bust-grid { grid-template-columns: 1fr; } }
  #toasts { position: absolute; top: max(12px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: grid; gap: 6px; justify-items: center; width: min(560px, 90vw); }
  .toast { font: 700 17px/1.2 var(--display); letter-spacing: 0.03em; text-transform: uppercase; padding: 7px 14px; border-radius: 5px; background: rgba(12,13,17,0.82); border-bottom: 2px solid var(--ink2); transition: opacity 0.35s, transform 0.35s; text-align: center; }
  .toast.good { border-color: var(--good); } .toast.warn { border-color: var(--warn); color: #ffe2b0; } .toast.bad { border-color: var(--bad); color: #ffd2c8; }
  .toast.out { opacity: 0; transform: translateY(-6px); }
  .bigmsg { position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%); text-align: center; text-shadow: 0 2px 18px rgba(0,0,0,0.7); width: min(900px, 92vw); }
  .bigmsg .bm-main { font: 800 clamp(30px, 6vw, 64px)/1 var(--display); text-transform: uppercase; letter-spacing: 0.02em; }
  .bigmsg .bm-sub { font: 600 clamp(15px, 2.2vw, 22px)/1.25 var(--display); color: var(--ink2); margin-top: 6px; }
  .bigmsg.bad .bm-main { color: #ff6a50; } .bigmsg.good .bm-main { color: var(--amber); } .bigmsg.warn .bm-main { color: var(--warn); } .bigmsg.ach .bm-main { color: var(--blue); font-size: clamp(22px, 4vw, 40px); }
  #prompt { position: absolute; bottom: 210px; left: 50%; transform: translateX(-50%); font: 700 18px var(--display); text-transform: uppercase; letter-spacing: 0.06em; background: rgba(12,13,17,0.8); padding: 8px 16px; border-radius: 6px; border: 1px solid var(--line); }
  #skills { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 38%; min-width: 170px; background: rgba(12,13,17,0.7); padding: 8px 12px 10px; border-radius: 6px; }
  .sk-mult { font: 700 14px var(--mono); color: var(--amber); }
  .sk-pts { font: 700 30px/1 var(--mono); }
  .sk-list { font: 600 13px var(--display); color: var(--ink2); text-transform: uppercase; margin-top: 2px; }
  .sk-bar { height: 3px; background: var(--amber); margin-top: 6px; }
  #driftScore { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); font: 700 24px var(--mono); color: var(--amber); text-shadow: 0 2px 10px #000; }
  #wrongWay { position: absolute; top: 22%; left: 50%; transform: translateX(-50%); font: 800 40px var(--display); color: var(--red); text-transform: uppercase; letter-spacing: 0.06em; text-shadow: 0 0 20px rgba(0,0,0,0.6); }
  #raceLights { position: absolute; top: 18%; left: 50%; transform: translateX(-50%); display: flex; gap: 14px; padding: 12px 16px; background: rgba(12,13,17,0.85); border-radius: 12px; }
  #raceLights i { width: 38px; height: 38px; border-radius: 50%; background: #2a0d0a; box-shadow: inset 0 0 0 3px #000; }
  #raceLights i.on { background: #ff2a1a; box-shadow: 0 0 24px #ff2a1a; }
  #raceLights i.go { background: #2cff6a; box-shadow: 0 0 24px #2cff6a; }
  .hud-tl { position: absolute; left: max(14px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); display: grid; gap: 8px; max-width: min(380px, 60vw); }
  #racePanel { background: rgba(12,13,17,0.78); padding: 10px 14px; border-radius: 6px; min-width: 160px; }
  .rp-big { font: 700 44px/1 var(--mono); } .rp-big small { font-size: 20px; color: var(--ink2); }
  .rp-lbl { font: 700 12px var(--display); color: var(--ink2); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .rp-row { display: flex; justify-content: space-between; gap: 16px; font: 600 15px var(--mono); }
  .rp-row span { color: var(--ink2); font-family: var(--display); text-transform: uppercase; letter-spacing: 0.05em; }
  .rp-note { margin-top: 6px; font: 600 15px var(--display); color: var(--amber); }
  #lesson { background: rgba(12,13,17,0.86); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; pointer-events: auto; font-size: 17px; line-height: 1.35; }
  .ls-head { display: flex; justify-content: space-between; font: 700 13px var(--display); color: var(--blue); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .ls-body b { color: var(--amber); }
  .ls-ex { margin-top: 8px; font-family: var(--mono); font-size: 14px; color: var(--ink2); }
  #lesson .btn { margin-top: 10px; }
  #debug { position: absolute; left: 10px; top: 120px; margin: 0; font: 500 11px/1.35 var(--mono); white-space: pre; background: rgba(0,0,0,0.65); padding: 8px; border-radius: 4px; color: #b9f6c8; }
  #revcam { position: absolute; left: 50%; bottom: max(14px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(360px, 36vw); aspect-ratio: 16 / 9; border: 2px solid rgba(255,255,255,0.65); border-radius: 6px; box-shadow: 0 0 0 1px #000; }
  #revcam::before { content: attr(data-label); position: absolute; top: -22px; left: 0; font: 700 12px var(--display); letter-spacing: 0.12em; background: rgba(12,13,17,0.8); padding: 2px 6px; border-radius: 3px; }
  #revcam svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #mirror { position: absolute; top: max(10px, env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); width: min(300px, 32vw); aspect-ratio: 4 / 1; border: 3px solid #111; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.6); }
  #sensor { position: absolute; left: 50%; bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + min(360px, 36vw) * 9 / 16 + 30px); transform: translateX(-50%); display: flex; gap: 4px; }
  #sensor i { width: 46px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.15); }
  #sensor[data-level="1"] i:nth-child(-n+1), #sensor[data-level="2"] i:nth-child(-n+2), #sensor[data-level="3"] i { background: var(--warn); }
  #sensor[data-level="3"] i { background: var(--bad); }
  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  #rewindFx { position: fixed; inset: 0; pointer-events: none; z-index: 7; background: radial-gradient(ellipse at center, rgba(80,40,0,0.06), rgba(40,20,0,0.45)); }
  #rewindFx span { position: absolute; top: 16%; left: 50%; transform: translateX(-50%); font: 800 34px var(--display); letter-spacing: 0.1em; color: var(--amber); text-shadow: 0 0 14px #000; }

  /* ---------- big map ---------- */
  #mapview { position: fixed; inset: 0; z-index: 12; background: rgba(8,10,12,0.92); display: grid; grid-template-rows: auto 1fr auto; padding-block: max(10px, env(safe-area-inset-top, 0px)) max(10px, env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  #mapview h2 { margin: 0 0 6px; font: 800 26px var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
  #bigmap { width: 100%; height: 100%; min-height: 0; cursor: crosshair; }
  .maplegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font: 600 14px var(--display); color: var(--ink2); align-items: center; }
  .maplegend i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: -1px; margin-right: 4px; }

  /* ---------- touch controls ---------- */
  #touch { position: fixed; inset: 0; z-index: 6; pointer-events: none; }
  #touch .tc { position: absolute; pointer-events: auto; touch-action: none; display: grid; place-items: center; font: 700 15px var(--display); text-transform: uppercase; letter-spacing: 0.05em; color: var(--ink); }
  .tc-pad { left: max(2vw, env(safe-area-inset-left, 0px)); bottom: max(3vh, env(safe-area-inset-bottom, 0px)); width: 30vw; height: 26vh; border-radius: 18px; background: rgba(12,13,17,0.38); border: 1px solid var(--line); }
  .tc-pad span { position: absolute; bottom: 6px; color: var(--ink2); font-size: 12px; }
  .tc-knob { width: 64px; height: 64px; border-radius: 50%; background: rgba(242,239,232,0.85); box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  .tc-btn { border-radius: 14px; background: rgba(12,13,17,0.5); border: 1px solid var(--line); }
  .tc-steer { bottom: max(3vh, env(safe-area-inset-bottom, 0px)); width: 14vw; height: 22vh; font-size: 36px; }
  .tc[data-id="steerL"] { left: max(2vw, env(safe-area-inset-left, 0px)); }
  .tc[data-id="steerR"] { left: calc(max(2vw, env(safe-area-inset-left, 0px)) + 16vw); }
  .tc-info { left: 3vw; bottom: 6vh; color: var(--ink2); }
  .tc-wheel { left: max(2vw, env(safe-area-inset-left, 0px)); bottom: max(2vh, env(safe-area-inset-bottom, 0px)); width: min(46vh, 27vw); height: min(46vh, 27vw); border-radius: 50%; }
  .tc-wrot { width: 100%; height: 100%; will-change: transform; }
